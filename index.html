<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Game Boy labels</title>
        <style>
            body {
                margin: 0;
                padding: 16px;
                background: #e8e6e1;
                font:
                    13px/1.3 system-ui,
                    sans-serif;
                color: #222;
            }
            h1 {
                font-size: 18px;
                font-weight: 600;
                margin: 0 0 4px;
            }
            h1 + p + main + h1 {
                margin-top: 32px;
            }
            p {
                margin: 0 0 16px;
                color: #555;
            }
            main {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                grid-auto-flow: dense;
                gap: 20px;
            }
            figure {
                margin: 0;
                container-type: inline-size;
                --mm: calc(100cqw / 60);
            }
            .cart {
                position: relative;
                width: calc(57 * var(--mm));
                margin: 0 auto;
                aspect-ratio: 57 / 65;
                background: center / 100% 100% no-repeat;
            }
            .tall {
                grid-row: span 2;
            }
            .tall .cart {
                aspect-ratio: 57 / 130;
            }
            .gray .cart {
                background-image: url("blank-cartridges/dmg-gray.png");
            }
            .black .cart {
                background-image: url("blank-cartridges/dmg-black.png");
            }
            .cgb .cart {
                background-image: url("blank-cartridges/cgb.png");
            }
            .agb .cart {
                width: calc(60 * var(--mm));
                aspect-ratio: 60 / 34.5;
                background-image: url("blank-cartridges/agb-gray.png");
            }
            .cart img {
                position: absolute;
                border-radius: calc(1.4 * var(--mm));
                box-shadow: 0 calc(0.2 * var(--mm)) calc(0.1 * var(--mm))
                    rgba(0, 0, 0, 0.4);
            }

            .dmg .cart img {
                left: calc(7.25 * var(--mm));
                top: calc(19 * var(--mm));
                width: calc(42.5 * var(--mm));
                height: calc(37 * var(--mm));
            }
            .cgb .cart img {
                left: calc(7.65 * var(--mm));
                top: calc(22.25 * var(--mm));
                width: calc(41.5 * var(--mm));
                height: calc(37 * var(--mm));
            }
            .agb .cart img {
                left: calc(8.5 * var(--mm));
                top: calc(8.05 * var(--mm));
                width: calc(43 * var(--mm));
                height: calc(22 * var(--mm));
            }
            figcaption {
                margin-top: 4px;
                overflow-wrap: anywhere;
            }
            .color {
                display: block;
                color: #555;
                font-style: italic;
            }
        </style>
    </head>
